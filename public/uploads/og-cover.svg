<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">QA Portfolio Cover</title>
  <desc id="desc">Preview image for the QA portfolio project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff" />
      <stop offset="100%" stop-color="#eef3ff" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="80" y="80" width="1040" height="470" rx="28" fill="#ffffff" stroke="#dbe6ff" />
  <text x="120" y="220" fill="#1f3261" font-family="Arial, sans-serif" font-size="28">QA Portfolio</text>
  <text x="120" y="300" fill="#0f172a" font-family="Arial, sans-serif" font-size="64" font-weight="700">
    Junior QA Engineer
  </text>
  <text x="120" y="360" fill="#4b5b84" font-family="Arial, sans-serif" font-size="28">
    Баг-репорты, тест-кейсы и чек-листы в одном портфолио
  </text>
  <circle cx="990" cy="210" r="56" fill="#4f7cff" opacity="0.16" />
  <circle cx="1040" cy="280" r="38" fill="#8ba7ff" opacity="0.28" />
</svg>
